<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Live Subtitles Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      font-family: 'Inconsolata', 'JetBrains Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Contenedor fijo anclado abajo al centro estilo broadcast / YouTube CC */
    #overlay-container {
      position: fixed;
      left: 50%;
      bottom: 5vh;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
      user-select: none;
      z-index: 999999;
    }

    /* Caja de subtítulo estilo YouTube CC (máximo 2 líneas) */
    .caption-box {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      background: rgba(8, 8, 10, 0.90);
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: var(--sub-font-size, 38px);
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      letter-spacing: 0.25px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);
      transition: opacity 0.25s ease-out, transform 0.2s ease-out;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      max-width: 96%;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .caption-box.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="overlay-container">
    <div id="caption-box" class="caption-box"></div>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const rawSession = urlParams.get('session') || urlParams.get('session_id') || urlParams.get('room');
      const session = rawSession ? rawSession.toLowerCase().trim() : '';
      const targetLang = (urlParams.get('lang') || urlParams.get('pair') || 'es').toLowerCase().trim();
      const timeoutSec = parseFloat(urlParams.get('timeout') || '6.0');
      const customFontSize = urlParams.get('size');

      const captionEl = document.getElementById('caption-box');
      if (customFontSize) {
        captionEl.style.setProperty('--sub-font-size', customFontSize.includes('px') ? customFontSize : customFontSize + 'px');
      }

      let silenceTimer = null;
      let ws = null;
      let heartbeatTimer = null;

      function showSubtitle(text) {
        if (!text || !text.trim()) return;
        const clean = text.trim();
        captionEl.textContent = clean;
        captionEl.classList.add('visible');

        // Limpiar y reiniciar timer de desvanecimiento por silencio
        if (silenceTimer) clearTimeout(silenceTimer);
        if (timeoutSec > 0) {
          silenceTimer = setTimeout(function () {
            captionEl.classList.remove('visible');
          }, timeoutSec * 1000);
        }
      }

      function getTargetText(item) {
        if (!item) return '';
        const l = targetLang;
        // 1. Matriz multilingüe de traducciones
        if (item.translations && item.translations[l]) return item.translations[l];
        if (item['text_' + l]) return item['text_' + l];
        // 2. Coincidencia con idioma origen
        if (l === (item.source_lang || '').toLowerCase() && item.text_source) return item.text_source;
        // 3. Fallbacks a texto traducido o texto origen
        return item.text_target || item.text_source || '';
      }

      function connect() {
        const isSecure = window.location.protocol === 'https:';
        const protocol = isSecure ? 'wss:' : 'ws:';
        const host = window.location.host || 'localhost:8000';
        const wsPath = session ? `/ws/${encodeURIComponent(session)}` : '/ws';
        const wsUrl = `${protocol}//${host}${wsPath}`;

        console.log(`[OVERLAY] Conectando a WebSocket: ${wsUrl} (Idioma objetivo: ${targetLang})`);

        try {
          ws = new WebSocket(wsUrl);
        } catch (e) {
          console.error('[OVERLAY] Error al crear WebSocket:', e);
          setTimeout(connect, 2000);
          return;
        }

        ws.onopen = function () {
          console.log('[OVERLAY] Conexión WebSocket establecida con éxito.');
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          heartbeatTimer = setInterval(function () {
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send('ping');
            }
          }, 25000);
        };

        ws.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            const history = Array.isArray(data.data) ? data.data : (Array.isArray(data.items) ? data.items : []);
            if (data.type === 'history' && history.length > 0) {
              const lastItem = history[history.length - 1];
              const text = getTargetText(lastItem);
              if (text) {
                console.log('[OVERLAY] Subtítulo inicial (historial):', text);
                showSubtitle(text);
              }
            } else if (data.text_target || data.text_source || (data.translations && Object.keys(data.translations).length > 0)) {
              const text = getTargetText(data);
              if (text) {
                console.log('[OVERLAY] Subtítulo en vivo recibido:', text);
                showSubtitle(text);
              }
            }
          } catch (e) {
            console.error('[OVERLAY] Error al procesar mensaje:', e);
          }
        };

        ws.onclose = function (e) {
          console.warn('[OVERLAY] Conexión cerrada. Reconectando en 2s...', e);
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          setTimeout(connect, 2000);
        };

        ws.onerror = function (e) {
          console.error('[OVERLAY] Error en WebSocket:', e);
          try { ws.close(); } catch (_) {}
        };
      }

      connect();
    })();
  </script>
</body>
</html>
